[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "printpro"
version = "2.0.0"
description = "Fichiers prêts pour l'imprimeur à partir d'images IA : PDF/X-1a CMJN avec fond perdu et traits de coupe, films DTF, vectorisation, montage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pillow>=10.0",
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
ia = ["rembg>=2.0"]
dev = ["pytest>=7.4", "httpx>=0.26"]

[project.scripts]
printpro = "printpro.cli:main"

[tool.setuptools]
packages = ["printpro"]

[tool.setuptools.package-data]
printpro = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
